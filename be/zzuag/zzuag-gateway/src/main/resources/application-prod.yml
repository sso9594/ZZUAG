server:
  port: 8080
spring:
  application:
    name: gateway
  config:
    activate:
      on-profile: prod
  cloud:
    gateway:
      routes:
        - id: query-route
          uri: lb://query-api
          predicates:
            - Path=/query/**
        - id: command-route
          uri: lb://command-api
          predicates:
            - Path=/post/**
      discovery:
        locator:
          enabled: false
      httpclient:
        pool:
          type: elastic
          max-connections: 200
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST}:${EUREKA_PORT}/eureka/
    fetch-registry: true
    register-with-eureka: true

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.hostname}:${server.port}
